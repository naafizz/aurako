<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurako Business — অনলাইন শপ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF3EE; --surface:#FFFFFF; --surface-soft:#FBF6F3;
    --ink:#2A1B1E; --ink-soft:#8A7370; --ink-faint:#B9A8A4;
    --plum:#6E2A3B; --plum-dark:#501F2C;
    --gold:#B8862E; --gold-soft:#F2E4C7;
    --green:#3F7D58; --green-soft:#E7F1EA;
    --line:#EADFDA; --radius:14px;
    --shadow: 0 1px 2px rgba(42,27,30,0.04), 0 8px 24px -12px rgba(42,27,30,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Hind Siliguri','Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  header{
    position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line);
    padding:16px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  .brand{font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--plum-dark);}
  .cart-btn{
    position:relative; background:var(--plum); color:#fff; border:none; border-radius:10px;
    padding:10px 18px; font-family:'Hind Siliguri',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer;
  }
  .cart-count{
    position:absolute; top:-8px; right:-8px; background:var(--gold); color:#fff; border-radius:999px;
    font-size:11px; font-weight:700; padding:2px 6px; min-width:18px; text-align:center;
  }
  main{max-width:1200px; margin:0 auto; padding:28px;}
  .search-row{margin-bottom:22px;}
  .search-row input{
    width:100%; max-width:420px; padding:12px 16px; border-radius:10px; border:1px solid var(--line);
    font-family:'Hind Siliguri',sans-serif; font-size:14.5px; background:var(--surface);
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:20px;}
  .card{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card img{width:100%; height:180px; object-fit:cover; background:var(--surface-soft);}
  .card-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-cat{font-size:11.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:0.03em;}
  .card-name{font-weight:700; font-size:15.5px; line-height:1.3;}
  .card-price{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--plum-dark); font-size:16px; margin-top:auto;}
  .add-btn{
    margin-top:8px; background:var(--gold-soft); color:var(--plum-dark); border:none; border-radius:8px;
    padding:9px; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .add-btn:hover{background:var(--gold); color:#fff;}
  .empty-msg{color:var(--ink-soft); text-align:center; padding:60px 0; font-size:15px;}

  .drawer-overlay{
    position:fixed; inset:0; background:rgba(42,27,30,0.35); z-index:30; display:none;
  }
  .drawer-overlay.open{display:block;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:100%; max-width:380px; background:var(--surface);
    z-index:31; transform:translateX(100%); transition:transform 0.25s ease; display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .drawer-head h2{font-family:'Fraunces',serif; font-size:20px; margin:0;}
  .drawer-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft);}
  .drawer-items{flex:1; overflow-y:auto; padding:16px 20px;}
  .cart-row{display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .cart-row img{width:52px; height:52px; object-fit:cover; border-radius:8px; background:var(--surface-soft);}
  .cart-row-info{flex:1; min-width:0;}
  .cart-row-name{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cart-row-price{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft);}
  .qty-ctrl{display:flex; align-items:center; gap:6px;}
  .qty-ctrl button{width:24px; height:24px; border:1px solid var(--line); background:var(--surface); border-radius:6px; cursor:pointer;}
  .cart-remove{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:15px;}
  .drawer-foot{padding:18px 20px; border-top:1px solid var(--line);}
  .drawer-total{display:flex; justify-content:space-between; font-weight:700; font-size:16px; margin-bottom:14px;}
  .checkout-btn{
    width:100%; background:var(--plum); color:#fff; border:none; border-radius:10px; padding:13px;
    font-weight:700; font-size:15px; cursor:pointer;
  }
  .checkout-btn:disabled{background:var(--ink-faint); cursor:not-allowed;}
</style>
</head>
<body>

<header>
  <div class="brand">Aurako Business</div>
  <button class="cart-btn" id="cartBtn">কার্ট <span class="cart-count" id="cartCount">0</span></button>
</header>

<main>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="প্রোডাক্ট খুঁজুন...">
  </div>
  <div class="grid" id="productGrid"></div>
  <div class="empty-msg" id="emptyMsg" style="display:none;">এখনো কোনো প্রোডাক্ট যোগ করা হয়নি।</div>
</main>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>আপনার কার্ট</h2>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div class="drawer-total"><span>মোট</span><span id="drawerTotal">৳0</span></div>
    <button class="checkout-btn" id="checkoutBtn">চেকআউট করুন</button>
  </div>
</div>

<script>
  const CART_KEY = "aurako:cart:v1";
  let products = [];
  let cart = [];

  function loadCart(){
    try{ cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }catch(e){ cart = []; }
  }
  function saveCart(){
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    renderCart();
  }
  function money(n){ return "৳" + Number(n||0).toLocaleString("en-US"); }

  async function loadProducts(){
    try{
      const res = await fetch("/api/products");
      products = await res.json();
    }catch(e){
      products = [];
    }
    renderGrid();
  }

  function renderGrid(filter){
    filter = (filter||"").trim().toLowerCase();
    const grid = document.getElementById("productGrid");
    const empty = document.getElementById("emptyMsg");
    const list = products.filter(p => !filter || p.name.toLowerCase().includes(filter) || (p.category||"").toLowerCase().includes(filter));
    grid.innerHTML = "";
    if(products.length === 0){
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    list.forEach(p=>{
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${p.image_url ? esc(p.image_url) : ''}" onerror="this.style.display='none'" alt="${esc(p.name)}">
        <div class="card-body">
          <div class="card-cat">${esc(p.category || '')}</div>
          <div class="card-name">${esc(p.name)}</div>
          <div class="card-price">${money(p.price)}</div>
          <button class="add-btn" data-id="${p.id}">+ কার্টে যোগ করুন</button>
        </div>
      `;
      card.querySelector(".add-btn").addEventListener("click", ()=> addToCart(p));
      grid.appendChild(card);
    });
  }

  function esc(s){
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function addToCart(p){
    const existing = cart.find(c => c.id === p.id);
    if(existing){ existing.qty += 1; }
    else{ cart.push({ id: p.id, name: p.name, price: Number(p.price), image_url: p.image_url, qty: 1 }); }
    saveCart();
    openDrawer();
  }

  function renderCart(){
    document.getElementById("cartCount").textContent = cart.reduce((s,c)=> s + c.qty, 0);
    const wrap = document.getElementById("drawerItems");
    wrap.innerHTML = "";
    if(cart.length === 0){
      wrap.innerHTML = '<p style="color:var(--ink-soft); font-size:14px;">কার্ট খালি</p>';
    }
    cart.forEach(c=>{
      const row = document.createElement("div");
      row.className = "cart-row";
      row.innerHTML = `
        <img src="${c.image_url ? esc(c.image_url) : ''}" onerror="this.style.display='none'">
        <div class="cart-row-info">
          <div class="cart-row-name">${esc(c.name)}</div>
          <div class="cart-row-price">${money(c.price)}</div>
        </div>
        <div class="qty-ctrl">
          <button data-act="dec">−</button>
          <span>${c.qty}</span>
          <button data-act="inc">+</button>
        </div>
        <button class="cart-remove" data-act="remove">✕</button>
      `;
      row.querySelector('[data-act="inc"]').addEventListener("click", ()=>{ c.qty += 1; saveCart(); });
      row.querySelector('[data-act="dec"]').addEventListener("click", ()=>{
        c.qty -= 1;
        if(c.qty <= 0) cart = cart.filter(x=>x.id !== c.id);
        saveCart();
      });
      row.querySelector('[data-act="remove"]').addEventListener("click", ()=>{
        cart = cart.filter(x=>x.id !== c.id);
        saveCart();
      });
      wrap.appendChild(row);
    });
    const total = cart.reduce((s,c)=> s + c.qty * c.price, 0);
    document.getElementById("drawerTotal").textContent = money(total);
    document.getElementById("checkoutBtn").disabled = cart.length === 0;
  }

  function openDrawer(){
    document.getElementById("drawer").classList.add("open");
    document.getElementById("drawerOverlay").classList.add("open");
  }
  function closeDrawer(){
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("drawerOverlay").classList.remove("open");
  }

  document.getElementById("cartBtn").addEventListener("click", openDrawer);
  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  document.getElementById("drawerOverlay").addEventListener("click", closeDrawer);
  document.getElementById("searchInput").addEventListener("input", (e)=> renderGrid(e.target.value));
  document.getElementById("checkoutBtn").addEventListener("click", ()=>{
    if(cart.length === 0) return;
    window.location.href = "checkout.html";
  });

  loadCart();
  renderCart();
  loadProducts();
</script>
</body>
</html>
