<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন — Aurako Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF3EE; --surface:#FFFFFF; --surface-soft:#FBF6F3;
    --ink:#2A1B1E; --ink-soft:#8A7370; --ink-faint:#B9A8A4;
    --plum:#6E2A3B; --plum-dark:#501F2C; --gold:#B8862E; --gold-soft:#F2E4C7;
    --green:#3F7D58; --green-soft:#E7F1EA; --red:#B23A48; --red-soft:#FBEAEC;
    --line:#EADFDA; --radius:14px;
    --shadow: 0 1px 2px rgba(42,27,30,0.04), 0 8px 24px -12px rgba(42,27,30,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Hind Siliguri',sans-serif;}
  header{padding:16px 28px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .brand{font-family:'Fraunces',serif; font-weight:700; font-size:24px; color:var(--plum-dark);}
  main{max-width:1100px; margin:0 auto; padding:28px;}
  .tabs{display:flex; gap:8px; margin-bottom:20px;}
  .tab-btn{background:none; border:none; padding:10px 18px; font-weight:600; font-size:14.5px; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--plum-dark); border-color:var(--plum);}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:18px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; color:var(--ink-soft); font-weight:600; padding:8px 6px; border-bottom:1px solid var(--line);}
  td{padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle;}
  input, select, textarea{padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-family:'Hind Siliguri',sans-serif; font-size:13.5px; background:var(--surface-soft);}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:12px;}
  .btn{background:var(--plum); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-weight:600; font-size:13.5px; cursor:pointer;}
  .btn.secondary{background:var(--gold-soft); color:var(--plum-dark);}
  .btn.danger{background:var(--red-soft); color:var(--red);}
  .login-wrap{display:flex; align-items:center; justify-content:center; min-height:100vh;}
  .login-card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:32px; width:320px;}
  .login-card h1{font-family:'Fraunces',serif; font-size:20px; margin-top:0;}
  .login-card input{width:100%; margin-bottom:12px;}
  .login-card button{width:100%;}
  .err{color:var(--red); font-size:13px; margin-top:8px;}
  .status-pill{border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:700;}
  .status-pending{background:var(--gold-soft); color:var(--plum-dark);}
  .status-confirmed, .status-shipped, .status-delivered{background:var(--green-soft); color:var(--green);}
  .status-cancelled{background:var(--red-soft); color:var(--red);}
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <h1>অ্যাডমিন লগইন</h1>
    <input type="password" id="adminPassInput" placeholder="অ্যাডমিন পাসওয়ার্ড">
    <button class="btn" id="loginBtn">ঢুকুন</button>
    <div class="err" id="loginErr" style="display:none;"></div>
  </div>
</div>

<div id="appScreen" style="display:none;">
  <header>
    <div class="brand">Aurako Business — অ্যাডমিন</div>
    <button class="btn secondary" id="logoutBtn">লগআউট</button>
  </header>
  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="products">প্রোডাক্ট</button>
      <button class="tab-btn" data-tab="orders">অর্ডার</button>
    </div>

    <div class="panel active" id="panel-products">
      <div class="card">
        <h3 style="margin-top:0;">নতুন প্রোডাক্ট যোগ করুন</h3>
        <div class="form-grid">
          <input type="text" id="pName" placeholder="নাম">
          <input type="text" id="pCategory" placeholder="ক্যাটাগরি">
          <input type="number" id="pPrice" placeholder="দাম (৳)">
          <input type="number" id="pStock" placeholder="স্টক">
          <input type="text" id="pImage" placeholder="ছবির URL">
        </div>
        <textarea id="pDesc" placeholder="বিবরণ (ঐচ্ছিক)" style="width:100%; min-height:60px; margin-bottom:12px;"></textarea>
        <button class="btn" id="addProductBtn">+ যোগ করুন</button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>নাম</th><th>ক্যাটাগরি</th><th>দাম</th><th>স্টক</th><th></th></tr></thead>
          <tbody id="productsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="panel-orders">
      <div class="card">
        <table>
          <thead><tr><th>কোড</th><th>কাস্টমার</th><th>ফোন</th><th>মোট</th><th>পেমেন্ট</th><th>ট্রানজেকশন আইডি</th><th>স্ট্যাটাস</th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  const ADMIN_KEY_STORAGE = "aurako:adminkey:v1";
  let adminKey = localStorage.getItem(ADMIN_KEY_STORAGE) || "";

  function money(n){ return "৳" + Number(n||0).toLocaleString("en-US"); }
  function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  async function tryEnter(){
    // verify the key by attempting an admin-only call
    try{
      const res = await fetch("/api/orders", { headers: { "x-admin-key": adminKey } });
      if(!res.ok) throw new Error("bad key");
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appScreen").style.display = "block";
      loadProducts();
      loadOrders();
      return true;
    }catch(e){
      return false;
    }
  }

  document.getElementById("loginBtn").addEventListener("click", async ()=>{
    const val = document.getElementById("adminPassInput").value;
    adminKey = val;
    const ok = await tryEnter();
    if(ok){
      localStorage.setItem(ADMIN_KEY_STORAGE, adminKey);
    }else{
      document.getElementById("loginErr").textContent = "পাসওয়ার্ড ভুল।";
      document.getElementById("loginErr").style.display = "block";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", ()=>{
    localStorage.removeItem(ADMIN_KEY_STORAGE);
    location.reload();
  });

  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  async function loadProducts(){
    const res = await fetch("/api/products");
    const products = await res.json();
    const body = document.getElementById("productsBody");
    body.innerHTML = "";
    products.forEach(p=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(p.name)}</td>
        <td>${esc(p.category||"")}</td>
        <td>${money(p.price)}</td>
        <td>${p.stock}</td>
        <td><button class="btn danger" data-id="${p.id}">মুছুন</button></td>
      `;
      tr.querySelector("button").addEventListener("click", async ()=>{
        if(!confirm("এই প্রোডাক্টটা মুছে ফেলবেন?")) return;
        await fetch("/api/products?id=" + p.id, { method:"DELETE", headers:{ "x-admin-key": adminKey } });
        loadProducts();
      });
      body.appendChild(tr);
    });
  }

  document.getElementById("addProductBtn").addEventListener("click", async ()=>{
    const name = document.getElementById("pName").value.trim();
    const category = document.getElementById("pCategory").value.trim();
    const price = parseFloat(document.getElementById("pPrice").value);
    const stock = parseInt(document.getElementById("pStock").value) || 0;
    const image_url = document.getElementById("pImage").value.trim();
    const description = document.getElementById("pDesc").value.trim();
    if(!name || isNaN(price)){ alert("নাম ও দাম আবশ্যক।"); return; }
    const btn = document.getElementById("addProductBtn");
    btn.disabled = true; btn.textContent = "যোগ হচ্ছে…";
    try{
      const res = await fetch("/api/products", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "x-admin-key": adminKey },
        body: JSON.stringify({ name, category, price, stock, image_url, description })
      });
      const data = await res.json().catch(()=> ({}));
      if(!res.ok){
        alert("প্রোডাক্ট যোগ করা যায়নি:\n" + (data.detail || data.error || ("status " + res.status)));
        return;
      }
      document.getElementById("pName").value = "";
      document.getElementById("pCategory").value = "";
      document.getElementById("pPrice").value = "";
      document.getElementById("pStock").value = "";
      document.getElementById("pImage").value = "";
      document.getElementById("pDesc").value = "";
      loadProducts();
    }catch(e){
      alert("নেটওয়ার্ক সমস্যা: " + e.message);
    }finally{
      btn.disabled = false; btn.textContent = "+ যোগ করুন";
    }
  });

  const statusLabels = {
    pending:"অপেক্ষমাণ", confirmed:"কনফার্ম", shipped:"পাঠানো হয়েছে",
    delivered:"ডেলিভার হয়েছে", cancelled:"বাতিল"
  };

  async function loadOrders(){
    const res = await fetch("/api/orders", { headers:{ "x-admin-key": adminKey } });
    const orders = await res.json();
    const body = document.getElementById("ordersBody");
    body.innerHTML = "";
    orders.forEach(o=>{
      const tr = document.createElement("tr");
      const selectOpts = Object.keys(statusLabels).map(k=>`<option value="${k}" ${k===o.status?"selected":""}>${statusLabels[k]}</option>`).join("");
      tr.innerHTML = `
        <td>${esc(o.order_code)}</td>
        <td>${esc(o.customer_name)}</td>
        <td>${esc(o.phone)}</td>
        <td>${money(o.total)}</td>
        <td>${esc(o.payment_method)}</td>
        <td>${esc(o.transaction_id||"—")}</td>
        <td><select data-id="${o.id}">${selectOpts}</select></td>
      `;
      tr.querySelector("select").addEventListener("change", async (e)=>{
        await fetch("/api/orders?id=" + o.id, {
          method:"PATCH",
          headers:{ "Content-Type":"application/json", "x-admin-key": adminKey },
          body: JSON.stringify({ status: e.target.value })
        });
      });
      body.appendChild(tr);
    });
  }

  if(adminKey) tryEnter();
</script>
</body>
</html>
